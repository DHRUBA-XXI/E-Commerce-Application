spring:
  application:
    name: E-commerce Platform

  datasource:
    url: jdbc:postgresql://localhost:5432/maitraStore
    username: postgres
    password: uranium235

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      repositories:
        enabled: false

  security:
    user:
      name: admin
      password: admin123

server:
  port: 8080
  servlet:
    context-path: /maitraStore

logging:
  level:
    root: INFO
    com.DhrubaStudio.E_commercePlatform: DEBUG
    org.springframework.security: TRACE
    org.springframework.security.web: TRACE
    org.springframework.web: DEBUG
    org.springframework.boot.autoconfigure: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"